name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    # ✅ Usamos macos-15 para obtener Xcode 16 (soluciona la advertencia de Flutter)
    runs-on: macos-15 

    steps:
      - name: Checkout repository
        # ✅ Actualizado a v5 para eliminar la advertencia de Node.js 20
        uses: actions/checkout@v5 

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ❌ ELIMINADO: El paso de "Install CocoaPods dependencies" 
      # Flutter lo hará automáticamente durante el build.

      - name: Build iOS (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r -y Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/Runner.ipa
          retention-days: 7
          include-hidden-files: true
