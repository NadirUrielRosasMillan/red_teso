name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    # Es mejor fijar una versión de macOS en lugar de 'latest' 
    # para evitar que una actualización de Xcode rompa tu build de repente.
    runs-on: macos-14 

    steps:
      - name: Checkout repository
        # v4.2.0 soluciona la advertencia de Node.js 20 que viste en la captura
        uses: actions/checkout@v4.2.0 

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Añadido para acelerar compilaciones futuras

      - name: Flutter Doctor (Opcional pero útil)
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # Añadido: Instalar Pods manualmente. Muchos fallos en CI vienen de aquí.
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload # Limpia por si acaso hay restos de una build anterior
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r -y Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/Runner.ipa
          retention-days: 7
