name: red_teso
description: "Plataforma para conectar talento del TESOEM con empresas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  
  # State Management & Utils
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "web/icons/logo_sis_color.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "web/icons/logo_sis_color.png"

flutter:
  uses-material-design: true
  assets:
    - web/icons/logo_sis_color.png
