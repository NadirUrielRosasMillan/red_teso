name: red_teso
description: "Plataforma para conectar talento del TESOEM con empresas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Firebase (Comentado o mantenido para después, no afecta si no se inicializa)
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.0.1
  
  # State Management & Utils
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Las líneas de abajo se comentan porque la carpeta assets/images/ no existe físicamente
  # assets:
  #   - assets/images/
