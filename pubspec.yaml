name: red_teso
description: "Plataforma para conectar talento del TESOEM con empresas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.0.1
  
  # State Management & Utils
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# Configuración corregida para reemplazar el icono por defecto de Android (ic_launcher)
flutter_launcher_icons:
  android: true       # CAMBIADO DE "launcher_icon" A true PARA SOBREESCRIBIR EL ICONO POR DEFECTO
  ios: true
  image_path: "web/icons/logo_sis_color.png"
  adaptive_icon_background: "#FFFFFF" # Fondo blanco para que combine limpio en el celular
  adaptive_icon_foreground: "web/icons/logo_sis_color.png"

flutter:
  uses-material-design: true
  assets:
    - web/icons/logo_sis_color.png
